[project]
name = "tally-platform"
version = "0.1.0"
description = "Local simulation scaffold for the Tally payments platform"
requires-python = ">=3.12"
dependencies = [
  "aiokafka>=0.14.0",
  "asyncpg>=0.29",
  "boto3>=1.43.105",
  "cryptography>=44.0",
  "fastapi>=0.115",
  "httpx>=0.27",
  "lightgbm>=4.7.0",
  "numpy>=2.5.3",
  "onnx>=1.23.1",
  "onnxmltools>=1.16.0",
  "onnxruntime>=1.30.0",
  "opentelemetry-api>=1.45.0",
  "opentelemetry-exporter-otlp-proto-http>=1.45.0",
  "opentelemetry-instrumentation-asyncpg>=0.66b0",
  "opentelemetry-instrumentation-fastapi>=0.66b0",
  "opentelemetry-instrumentation-httpx>=0.66b0",
  "opentelemetry-sdk>=1.45.0",
  "prometheus-client>=0.26.0",
  "pydantic>=2.9",
  "pyjwt[crypto]>=2.15.1",
  "redis>=5.0",
  "scikit-learn>=1.9.1",
  "uvicorn>=0.30",
]

[dependency-groups]
dev = [
  "mypy>=1.11",
  "pytest>=8.3",
  "hypothesis>=6.112",
  "mutmut>=3.7,<4",
  "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["services", "libs", "tests"]
extend-exclude = ["mutants"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "."
packages = []

[[tool.mypy.overrides]]
module = [
  "asyncpg", "asyncpg.*", "aiokafka", "aiokafka.*", "boto3", "boto3.*", "botocore", "botocore.*",
  "onnxruntime", "onnxruntime.*", "onnxmltools", "onnxmltools.*", "sklearn", "sklearn.*",
  "lightgbm", "lightgbm.*", "scipy", "scipy.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]

[tool.mutmut]
source_paths = ["libs/money", "services/ledger"]
only_mutate = ["libs/money/money.py", "services/ledger/model.py"]
on_dependency_change = "rerun"
pytest_add_cli_args_test_selection = [
  "tests/unit/test_money.py",
  "tests/unit/test_ledger_model.py",
  "tests/property/test_allocation.py",
]

[tool.ruff.lint.per-file-ignores]
# PromQL query literals read better unwrapped.
"scripts/build_dashboards.py" = ["E501"]
