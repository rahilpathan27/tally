{{- $root := . }}
{{- $g := .Values.global }}
# Zero-trust baseline: nothing talks to anything unless a policy below allows it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tally-default-deny
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "tally.labels" (dict "root" $ "name" "") | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tally-allow-dns-and-telemetry
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "tally.labels" (dict "root" $ "name" "") | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: {{ $g.observabilityNamespace }}}
      ports:
        - {protocol: TCP, port: 4318}
{{- range $name, $w := .Values.workloads }}
{{- if ne (toString $w.enabled) "false" }}
{{- $callers := list }}
{{- range $other, $ow := $root.Values.workloads }}
{{- if and (has $name ($ow.calls | default list)) (ne (toString $ow.enabled) "false") }}
{{- $callers = append $callers $other }}
{{- end }}
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "tally.name" $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "tally.labels" (dict "root" $root "name" $name) | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "tally.selector" $name | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    # Prometheus scrapes /metrics.
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: {{ $g.monitoringNamespace }}}
      ports:
        - {protocol: TCP, port: {{ $w.port }}}
    {{- if $callers }}
    - from:
        {{- range $callers }}
        - podSelector:
            matchLabels:
              {{- include "tally.selector" . | nindent 14 }}
        {{- end }}
      ports:
        - {protocol: TCP, port: {{ $w.port }}}
    {{- end }}
    {{- if $w.public }}
    - from:
        {{- range $g.albCidrs }}
        - ipBlock: {cidr: {{ . }}}
        {{- end }}
      ports:
        - {protocol: TCP, port: {{ $w.port }}}
    {{- end }}
  egress:
    {{- range $peer := $w.calls }}
    - to:
        - podSelector:
            matchLabels:
              {{- include "tally.selector" $peer | nindent 14 }}
      ports:
        - {protocol: TCP, port: {{ (index $root.Values.workloads $peer).port }}}
    {{- end }}
    {{- include "tally.storeEgress" (dict "root" $root "stores" $w.stores) | nindent 4 }}
{{- end }}
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tally-jobs
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "tally.labels" (dict "root" $ "name" "") | nindent 4 }}
spec:
  podSelector:
    matchLabels: {tally.io/job: "true"}
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    {{- include "tally.storeEgress" (dict "root" $ "stores" (list "postgres" "https")) | nindent 4 }}
