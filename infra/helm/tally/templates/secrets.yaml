{{- $s := .Values.secrets }}
{{- $sets := dict }}
{{- range $name, $w := .Values.workloads }}
{{- if and $w.secretKeys (ne (toString $w.enabled) "false") }}
{{- $_ := set $sets $name $w.secretKeys }}
{{- end }}
{{- end }}
{{- if .Values.migrations.enabled }}
{{- $_ := set $sets "migrate" .Values.migrations.secretKeys }}
{{- end }}
{{- $_ := set $sets "jobs" .Values.cronSecretKeys }}
{{- range $name, $keys := $sets }}
---
{{- if eq $s.provider "external" }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "tally.secretName" $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "tally.labels" (dict "root" $ "name" "") | nindent 4 }}
  {{- if eq $name "migrate" }}
  annotations:
    # The migration hook needs its Secret before the sync wave that runs it.
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-2"
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-2"
    helm.sh/hook-delete-policy: before-hook-creation
  {{- end }}
spec:
  refreshInterval: {{ $s.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ $s.secretStore }}
  target:
    name: {{ include "tally.secretName" $name }}
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    {{- range $keys }}
    - secretKey: {{ . }}
      remoteRef:
        key: {{ $s.prefix }}/{{ $name }}
        property: {{ . }}
    {{- end }}
{{- else }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tally.secretName" $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "tally.labels" (dict "root" $ "name" "") | nindent 4 }}
    tally.io/inline-secret: "true"
  {{- if eq $name "migrate" }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-2"
    helm.sh/hook-delete-policy: before-hook-creation
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-2"
  {{- end }}
type: Opaque
stringData:
  {{- range $keys }}
  {{ . }}: {{ required (printf "secrets.inlineValues.%s is required for the inline provider" .) (index $s.inlineValues .) | quote }}
  {{- end }}
{{- end }}
{{- end }}
