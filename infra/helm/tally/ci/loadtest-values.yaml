# Layered on local-values.yaml for scripts/loadtest_k8s.py. The merchant rate limit is lifted so
# the test measures the payment path, not the limiter; replicas are fixed so results are
# comparable between runs (HPA behaviour is exercised separately).
podDefaults:
  terminationGracePeriodSeconds: 30
mediumResources: &medium {requests: {cpu: 250m, memory: 256Mi}, limits: {memory: 768Mi}}
workloads:
  core:
    replicas: 3
    resources: *medium
    env: {TALLY_MERCHANT_RATE_LIMIT_PER_MINUTE: "1000000"}
  core-worker: {resources: *medium}
  ledger: {replicas: 2, resources: *medium}
  risk: {replicas: 2, resources: {requests: {cpu: 250m, memory: 384Mi}, limits: {memory: 1Gi}}}
  bank-sim: {resources: *medium}
  payer-psp-sim: {resources: *medium}
config:
  LEDGER_VERIFY_INTERVAL_SECONDS: "60"
rollouts:
  steps:
    - setWeight: 50
    - pause: {duration: 1m}
