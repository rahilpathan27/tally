receivers:
  otlp:
    protocols:
      http: {endpoint: 0.0.0.0:4318}
  filelog:
    include: [/logs/*.log]
    start_at: end
    operators:
      - type: json_parser
        timestamp: {parse_from: attributes.ts, layout_type: gotime, layout: "2006-01-02T15:04:05.999999Z07:00"}
        severity: {parse_from: attributes.level}
      - type: move
        from: attributes.service
        to: resource["service.name"]
processors:
  batch: {}
exporters:
  otlphttp/tempo: {endpoint: http://tempo:4318}
  otlphttp/loki: {endpoint: http://loki:3100/otlp}
service:
  pipelines:
    traces: {receivers: [otlp], processors: [batch], exporters: [otlphttp/tempo]}
    logs: {receivers: [filelog, otlp], processors: [batch], exporters: [otlphttp/loki]}
